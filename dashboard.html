<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BackupInsight Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>BackupInsight Analytics</h1>
            <p>Your backup analysis results</p>
        </header>

        <main id="dashboard-content">
            <!-- Dashboard content will be populated here -->
            <div id="loading-message">Loading dashboard data...</div>
        </main>

        <script>
            // Fetch and display dashboard information
            async function loadDashboard() {
                try {
                    const response = await fetch('/dashboard-data');
                    const data = await response.json();
                    
                    document.getElementById('loading-message').innerHTML = '';
                    
                    let html = `
                        <div class="analytics-card">
                            <h2>Your Backup Analysis</h2>
                            <div class="stats-grid">
                                <div class="stat-item">
                                    <span class="stat-value">${data.totalFiles}</span>
                                    <span class="stat-label">Total Files</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-value">${data.totalSize}</span>
                                    <span class="stat-label">Total Size</span>
                                </div>
                            </div>
                        </div>
                    `;

                    // Add insights section
                    html += `<div class="insights-section">
                        <h3>Personalized Insights</h3>
                        ${data.insights.map(insight => `<p>${insight}</p>`).join('')}
                    </div>`;
                    
                    document.getElementById('dashboard-content').innerHTML = html;
                } catch (error) {
                    console.error('Error loading dashboard:', error);
                    document.getElementById('loading-message').innerHTML = '<p>Failed to load dashboard data.</p>';
                }
            }

            // Load on page load
            loadDashboard();
        </script>
    </div>
</body>
</html>
