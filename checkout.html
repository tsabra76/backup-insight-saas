<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BackupInsight - Secure Subscription</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://js.stripe.com/v3/"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>BackupInsight</h1>
            <p>Discover the value in your digital backups</p>
        </header>

        <main>
            <div id="payment-form" class="form-container">
                <h2>Subscribe Now - $9.99/month</h2>
                <p>Your backup contains significant electronic music collections worth $896 in value.</p>
                
                <form id="subscription-form">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="card-element">Credit Card</label>
                        <div id="card-element" class="field"></div>
                        <div id="card-errors" role="alert"></div>
                    </div>

                    <button type="submit" id="submit-button">
                        <span id="button-text">Subscribe Now - $9.99/month</span>
                    </button>
                </form>
            </div>

            <div id="loading
