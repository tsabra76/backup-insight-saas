<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BackupInsight - Subscribe</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        .price { font-size: 24px; font-weight: bold; color: #28a745; }
    </style>
</head>
<body>
    <h1>BackupInsight</h1>
    <p>Analyze and value your backup collection</p>
    
    <div class="price">$9.99/month</div>
    
    <form id="subscriptionForm">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
        </div>
        
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        
        <div class="form-group">
            <label for="card-element">Credit Card Information</label>
            <div id="card-element">
              <!-- A Stripe Element will be inserted here -->
            </div>
            <div id="card-errors" role="alert"></div>
        </div>
        
        <button type="submit">Subscribe Now</button>
    </form>
    
    <script src="https://js.stripe.com/v3/"></script>
    <script>
        // Initialize Stripe with your publishable key
        const stripe = Stripe('pk_live_51Ts7n54NXDrGH2trmuZUfnHVlyGuCyuJu0eCQlgSgXjFuOIGr7aZ46FBnA3dKKNxATGhpVIu3W3YqrNRikthI1rL00N4pDw9yK');
        const elements = stripe.elements();
        
        // Create an instance of the card Element
        const card = elements.create('card');
        
        // Add an instance of the card Element into the `card-element` DOM element
        card.mount('#card-element');
        
        // Handle form submission
        const form = document.getElementById('subscriptionForm');
        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            
            try {
                // In a real implementation, we would create a payment method first
                // For now we simulate the payment flow
                console.log('Processing subscription...', { name, email });
                
                // Simulate API call to backend server
                const response = await fetch('/subscribe', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, email })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert('Subscription successful! Redirecting to dashboard...');
                    // In a real implementation, this would redirect to the user's dashboard
                    window.location.href = '/dashboard.html';
                } else {
                    throw new Error(result.message || 'Failed to process subscription');
                }
            } catch (error) {
                console.error('Subscription error:', error);
                alert('Error processing subscription: ' + error.message);
            }
        });
    </script>
</body>
</html>
